<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>My form exercise</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header>
    <h1>Product Pick</h1>
  </header>
  <main>
    <form>
      <!-- Customer Name -->
      <fieldset>
        <legend>Customer Information</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required minlength="2" placeholder="Enter your full name">
        <p>Must be at least 2 characters long</p>
      </fieldset>

      <!-- Email -->
      <fieldset>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
        <p>Must be a valid email address</p>
      </fieldset>

      <!-- Color Selection -->
      <fieldset>
        <legend>T-Shirt Color</legend>

        <input type="radio" id="color-blue" name="color" value="blue" required>
        <label for="color-blue">Blue</label>
        <br><br>

        <input type="radio" id="color-black" name="color" value="black">
        <label for="color-black">Black</label>
        <br><br>

        <input type="radio" id="color-white" name="color" value="white">
        <label for="color-white">White</label>
      </fieldset>

      <!-- Size Selection -->
      <fieldset>
        <legend>T-Shirt Size</legend>

        <input type="radio" id="size-xs" name="size" value="xs" required>
        <label for="size-xs">XS</label>
        <br><br>

        <input type="radio" id="size-s" name="size" value="s">
        <label for="size-s">S</label>
        <br><br>

        <input type="radio" id="size-m" name="size" value="m">
        <label for="size-m">M</label>
        <br><br>

        <input type="radio" id="size-l" name="size" value="l">
        <label for="size-l">L</label>
        <br><br>

        <input type="radio" id="size-xl" name="size" value="xl">
        <label for="size-xl">XL</label>
        <br><br>

        <input type="radio" id="size-xxl" name="size" value="xxl">
        <label for="size-xxl">XXL</label>
      </fieldset>

      <!-- Submit Button -->
      <button type="submit">Place Order</button>
    </form>
  </main>
  <footer>
    <!-- change to your name-->
    <h2>By CARLOS MARQUINA</h2>
  </footer>
</body>

</html>
